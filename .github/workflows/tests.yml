name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.24"

    - name: Build
      run: go build -v

    - run: go test
    - run: go vet
    - run: test -z $(gofmt -l .) || { echo Please run go fmt.; exit 1; }
